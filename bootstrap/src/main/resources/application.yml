spring:
  application:
    name: Kera demo
  datasource:
    url: jdbc:postgresql://localhost:5432/kera_demo
    username: demo_user
    password: demo_password
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: default
logging:
  level:
    root: info
---
spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    contexts: default,dev
